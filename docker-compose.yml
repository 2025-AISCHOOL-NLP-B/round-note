
services:
  # PostgreSQL 서비스 정의
  db:
    image: pgvector/pgvector:pg15
    container_name: roundnote_db
    environment:
      # Docker 내부에서 사용할 PostgreSQL 환경 변수 (아래 .env 파일과 일치해야 함)
      POSTGRES_USER: roundnote_user
      POSTGRES_PASSWORD: roundnote_password
      POSTGRES_DB: roundnote_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # 데이터 영속성을 위해 볼륨 연결

  # Redis 서비스 정의
  redis:
    image: redis:7-alpine
    container_name: roundnote_redis
    ports:
      - "6379:6379"

  # FastAPI 백엔드 + RQ Worker 통합 서비스
  backend:
    container_name: roundnote_backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app/backend
      - ./audio_storage:/app/audio_storage
    working_dir: /app/backend
    # API와 Worker를 동시에 실행
    command: /bin/sh -c "alembic upgrade head && (python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload &) && sleep 3 && python worker.py"

  # RQ Worker 서비스 정의 (ElevenLabs 배치 전사 처리)
  worker:
    container_name: roundnote_worker
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://roundnote_user:roundnote_password@db:5432/roundnote_db
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app/backend
      - ./audio_storage:/app/audio_storage
    working_dir: /app
    command: python backend/worker.py

# PostgreSQL 데이터 영속성 볼륨 정의
volumes:
  postgres_data: